<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <title>관리자 로그인</title>
</head>
<body>
<main class="page login-wrap">
    <form class="card stack" style="width: 100%" th:action="@{/login}" method="post">
        <h1 class="title">관리자 로그인</h1>
        <div class="alert error" th:if="${param.error}">아이디 또는 비밀번호가 올바르지 않습니다.</div>
        <div class="alert" th:if="${param.logout}">로그아웃되었습니다.</div>
        <div class="field">
            <label for="username">아이디</label>
            <input class="input" id="username" type="text" name="username" placeholder="user" autocomplete="username">
        </div>
        <div class="field">
            <label for="password">비밀번호</label>
            <input class="input" id="password" type="password" name="password" placeholder="1234" autocomplete="current-password">
        </div>
        <button class="btn btn-primary btn-block" type="submit">로그인</button>
    </form>
</main>
</body>
</html>
