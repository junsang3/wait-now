<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <title th:text="'번호표 ' + ${waiting.ticketNumber} + '번'">내 웨이팅</title>
</head>
<body>
<main class="page" th:with="status=${waiting.status.name()}">
    <section class="card ticket">
        <p class="ticket__store" th:text="${waiting.store.name}">매장이름</p>
        <p class="ticket__number"><span th:text="${waiting.ticketNumber}">0</span><small>번</small></p>
        <span class="badge"
              th:classappend="'badge--' + ${#strings.toLowerCase(status)}"
              th:text="${waiting.status.label}">상태</span>

        <p class="ticket__position" th:if="${status == 'WAITING'}">
            내 순서 <strong th:text="${position} + '번째'">1번째</strong>
        </p>
        <p class="ticket__message ticket__message--called" th:if="${status == 'CALLED'}">지금 입장해 주세요!</p>
        <p class="ticket__message muted" th:if="${status == 'SEATED'}">입장이 완료되었어요.</p>
        <p class="ticket__message muted" th:if="${status == 'CANCELED'}">취소된 웨이팅이에요.</p>
    </section>

    <section class="card">
        <h2 class="card__title">웨이팅 정보</h2>
        <dl class="details">
            <dt>인원수</dt>
            <dd th:text="${waiting.partySize} + '명'">4명</dd>
            <dt>전화번호</dt>
            <dd th:text="${waiting.phoneNumber}">010-0000-0000</dd>
            <dt>등록시간</dt>
            <dd th:text="${#temporals.format(waiting.createdAt, 'M월 d일 HH:mm')}">등록시간</dd>
            <th:block th:if="${waiting.calledAt != null}">
                <dt>호출시간</dt>
                <dd th:text="${#temporals.format(waiting.calledAt, 'HH:mm')}">호출시간</dd>
            </th:block>
            <th:block th:if="${waiting.finishedAt != null}">
                <dt th:text="${status == 'SEATED' ? '착석시간' : '취소시간'}">종료시간</dt>
                <dd th:text="${#temporals.format(waiting.finishedAt, 'HH:mm')}">종료시간</dd>
            </th:block>
        </dl>
    </section>

    <form th:if="${waiting.status.canCancel()}"
          th:action="@{/waitings/cancel}" method="post" onsubmit="return confirm('웨이팅을 취소할까요?')">
        <input type="hidden" name="ticketToken" th:value="${waiting.ticketToken}">
        <button class="btn btn--ghost-danger btn--block" type="submit">웨이팅 취소</button>
    </form>

    <a class="btn btn--secondary btn--block" th:href="@{/stores/{id}(id=${waiting.store.id})}">매장 페이지로</a>
</main>
</body>
</html>
