<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@4.0.1/dist/htmx.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@4.0.1/dist/ext/hx-sse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <title th:text="${store.name}">매장</title>
</head>
<body>
    <div th:hx-sse:connect="@{/stores/{id}/events(id=${storeId})}" hx-swap="none" hx-config="sse.pauseOnBackground:false"></div>

    <main class="page">
        <section class="card stack">
            <div class="store-head">
                <h1 class="title" th:text="${store.name}">매장이름</h1>
                <span class="badge" th:classappend="${store.open} ? 'open'"
                      th:text="${store.open ? '접수중' : '접수종료'}">상태</span>
            </div>
            <div>
                <p class="muted">현재 대기</p>
                <p class="big-number"><span th:fragment="waitingCount"
                      th:text="${waitingCount}"
                      th:hx-get="@{/stores/{id}/waitingCount(id=${storeId})}"
                      hx-swap="outerHTML"
                      hx-trigger="waiting-changed from:body">0</span><small>팀</small></p>
            </div>
        </section>

        <form class="card stack" th:action="@{/waitings}" method="post">
            <input type="hidden" name="storeId" th:value="${storeId}">
            <div class="field">
                <label for="partySize">인원수</label>
                <input class="input" id="partySize" type="number" name="partySize" value="4" min="1" inputmode="numeric">
            </div>
            <div class="field">
                <label for="phoneNumber">전화번호</label>
                <input class="input" id="phoneNumber" type="tel" name="phoneNumber" value="010-1234-5678" inputmode="tel">
            </div>
            <button class="btn btn-primary btn-block" type="submit" th:disabled="${!store.open}"
                    th:text="${store.open ? '웨이팅 등록하기' : '지금은 접수하지 않아요'}">웨이팅 등록하기</button>
        </form>

        <section class="card qr">
            <canvas id="qr"></canvas>
            <p class="muted">QR을 찍어 이 페이지로 바로 들어올 수 있어요</p>
        </section>
    </main>
    <script>QRCode.toCanvas(document.getElementById("qr"), location.href, { width: 180, margin: 0 });</script>
</body>
</html>
