<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@4.0.1/dist/htmx.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@4.0.1/dist/ext/hx-sse.min.js"></script>
</head>
<body>
    <div th:hx-sse:connect="@{/admin/stores/{id}/events(id=${storeId})}" hx-swap="none"></div>

    <span th:text="${store.name}">매장이름</span>

    <form th:unless="${store.open}"
          th:action="@{/admin/stores/{id}/open(id=${storeId})}"
          method="post"
          onsubmit="return confirm('접수를 열까요?')">
        <button type="submit">접수 열기</button>
    </form>
    <form th:if="${store.open}"
          th:action="@{/admin/stores/{id}/close(id=${storeId})}"
          method="post"
          onsubmit="return confirm('접수를 닫으면 남은 웨이팅이 모두 취소됩니다. 닫을까요?')">
        <button type="submit">접수 닫기</button>
    </form>

    <div th:fragment="tabs" hx-target:inherited="this" hx-swap:inherited="outerHTML">
        <div>
            <button th:hx-get="@{/admin/stores/{id}/active(id=${storeId})}">웨이팅 중</button>
            <button th:hx-get="@{/admin/stores/{id}/seated(id=${storeId})}">착석</button>
            <button th:hx-get="@{/admin/stores/{id}/canceled(id=${storeId})}">취소</button>
        </div>
        <th:block th:each="waiting : ${waitings}">
            <div th:fragment="waiting" hx-target:inherited="this">
                <span th:text="${waiting.ticketNumber}">웨이팅 번호</span>
                <span th:text="${waiting.status.label}">상태</span>
                <span th:text="${waiting.partySize}">인원수</span>
                <span th:text="${waiting.phoneNumber}">전화번호</span>
                <span th:text="${waiting.createdAt}">등록시간</span>
                <button th:hx-post="@{/admin/waitings/{id}/call(id=${waiting.id})}"
                        th:disabled="${!waiting.status.canCall()}"
                        hx-confirm="웨이팅을 호출할까요?">호출</button>
                <button th:hx-post="@{/admin/waitings/{id}/seat(id=${waiting.id})}"
                        th:disabled="${!waiting.status.canSeat()}"
                        hx-swap="delete"
                        hx-confirm="웨이팅을 착석할까요?">착석</button>
                <button th:hx-post="@{/admin/waitings/{id}/cancel(id=${waiting.id})}"
                        th:disabled="${!waiting.status.canCancel()}"
                        hx-swap="delete"
                        hx-confirm="웨이팅을 취소할까요?">취소</button>
            </div>
        </th:block>
    </div>
</body>
</html>
