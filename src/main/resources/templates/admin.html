<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@4.0.0/dist/htmx.min.js" integrity="sha384-BvJpBiO8Kh31EqtJe5DRIeWrHWnCGkwytKs9NKFi86Hhw96dEqdEMzZDeK9iEGTc" crossorigin="anonymous"></script>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="../static/css/style.css">
    <title th:text="${store.name + ' 관리'}">Document</title>
</head>
<body>
<main class="container container-wide">
    <header class="card admin-header">
        <h1 class="store-name" th:text="${store.name}">매장이름</h1>
        <th:block th:fragment="storeToggle">
            <button class="btn btn-outline" th:if="${store.open}" th:hx-post="@{/admin/stores/{id}/close(id=${storeId})}" hx-swap="outerHTML">접수 닫기</button>
            <button class="btn btn-primary" th:unless="${store.open}" th:hx-post="@{/admin/stores/{id}/open(id=${storeId})}" hx-swap="outerHTML">접수 열기</button>
        </th:block>
    </header>

    <section class="card" th:fragment="tabs" hx-target:inherited="this" hx-swap:inherited="outerHTML">
        <nav class="tabs">
            <button class="tab" th:classappend="${tab == null or tab == 'active'} ? 'is-active'" th:hx-get="@{/admin/stores/{id}/active(id=${storeId})}">웨이팅 중</button>
            <button class="tab" th:classappend="${tab == 'seated'} ? 'is-active'" th:hx-get="@{/admin/stores/{id}/seated(id=${storeId})}">착석</button>
            <button class="tab" th:classappend="${tab == 'canceled'} ? 'is-active'" th:hx-get="@{/admin/stores/{id}/canceled(id=${storeId})}">취소</button>
        </nav>
        <div class="waiting-list">
            <th:block th:each="waiting : ${waitings}">
                <div class="waiting-item" th:fragment="waiting" hx-target:inherited="this">
                    <span class="waiting-number" th:text="${waiting.ticketNumber}">웨이팅 번호</span>
                    <div class="waiting-info">
                        <span class="badge"
                              th:classappend="${'status-' + #strings.toLowerCase(waiting.status.name())}"
                              th:text="${waiting.status.label}">상태</span>
                        <span class="phone" th:text="${waiting.phoneNumber}">전화번호</span>
                        <span class="meta" th:text="${waiting.partySize + '명'}">인원수</span>
                        <span class="meta" th:text="${#temporals.format(waiting.createdAt, 'HH:mm') + ' 등록'}">등록시간</span>
                    </div>
                    <div class="waiting-actions">
                        <button class="btn btn-sm btn-primary"
                                th:hx-post="@{/admin/waitings/{id}/call(id=${waiting.id})}"
                                th:disabled="${!waiting.status.canCall()}"
                                hx-confirm="웨이팅을 호출할까요?">호출</button>
                        <button class="btn btn-sm"
                                th:hx-post="@{/admin/waitings/{id}/seat(id=${waiting.id})}"
                                th:disabled="${!waiting.status.canSeat()}"
                                hx-confirm="웨이팅을 착석할까요?">착석</button>
                        <button class="btn btn-sm btn-danger"
                                th:hx-post="@{/admin/waitings/{id}/cancel(id=${waiting.id})}"
                                th:disabled="${!waiting.status.canCancel()}"
                                hx-confirm="웨이팅을 취소할까요?">취소</button>
                    </div>
                </div>
            </th:block>
            <p class="empty" th:if="${#lists.isEmpty(waitings)}">웨이팅이 없어요</p>
        </div>
    </section>
</main>
</body>
</html>
